services:
  - type: web
    name: farmtotable-api-gateway
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: PRODUCER_SERVICE_URL
        sync: false
      - key: CATALOG_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: LOGISTICS_SERVICE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: ANALYTICS_SERVICE_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: PRICING_SERVICE_URL
        sync: false
